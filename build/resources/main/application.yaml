spring:
  application:
    name: ia-prompt
  ai:
    openai:
      api-key: ${SPRING_AI_OPENAI_API_KEY}
    anthropic:
      api-key: ${SPRING_AI_ANTHROPIC_API_KEY}
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: gemma4

logging:
  level:
    org:
      zalado:
        logbook:
          format:
            loggers: TRACE

